[project]
name = "mech-forza-control"
version = "0.1.0"
description = "Mechrevo notebook EC direct control"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "mech-forza-control contributors" },
]
license = "GPL-3.0-only"
keywords = ["ec", "mechrevo", "fan-control", "keyboard-backlight"]

[project.scripts]
mfc = "src.__main__:main"
mfc-kde-osd = "src.kde_osd:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/docs",
    "/src",
    "/systemd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
